[package]
name = "tabula-tray"
version = "0.1.0"
description = "Starts, stops and watches tabula worker from the system tray"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

# The core is a library so main.rs only wires it to Tauri; the "_lib" suffix keeps its name apart from the binary's
# (on Windows equal names collide in the build output).
[lib]
name = "tabula_tray_lib"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
# Reads whether the taskbar is light or dark, and whether the tray runs with Redirection Guard.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
