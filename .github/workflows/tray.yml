name: Tray
on:
  push:
    branches: [main]
    # Path filters are not applied to tag pushes: a tray-v* tag always builds and releases.
    tags: ['tray-v*']
    paths: ['apps/tray/**', 'apps/web/src/ui/tokens.css', 'pnpm-lock.yaml', '.github/workflows/tray.yml']
  pull_request:
    paths: ['apps/tray/**', 'apps/web/src/ui/tokens.css', 'pnpm-lock.yaml', '.github/workflows/tray.yml']
  workflow_dispatch:

permissions: { contents: read }

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: apps/tray }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf libfuse2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: 'apps/tray/src-tauri -> target' }
      # One workspace, one lockfile: install from the repository root.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Type-checks and builds the window into apps/tray/dist (gitignored): the Rust core embeds it at compile time.
      - run: pnpm build:web
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm tauri build --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tray-${{ runner.os }}
          path: |
            apps/tray/src-tauri/target/release/bundle/msi/*.msi
            apps/tray/src-tauri/target/release/bundle/deb/*.deb
            apps/tray/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/tray-v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: bundles, merge-multiple: true }
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Tabula tray ${TAG#tray-v}" \
                 --notes "Windows: the .msi. Ubuntu: the .deb or the .AppImage. See the README, section Tray app."
          # The file names contain spaces ("Tabula tray_…"): pass them NUL-separated.
          find bundles -type f -print0 | xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
