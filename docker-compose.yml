services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabula
      POSTGRES_USER: tabula
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - tabula-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabula -d tabula"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tabula:${POSTGRES_PASSWORD}@db:5432/tabula
      TABULA_TOKEN: ${TABULA_TOKEN:?set TABULA_TOKEN in .env}
      TABULA_CONNECTOR_SECRET: ${TABULA_CONNECTOR_SECRET:-}
      TABULA_WORKER_TOKEN: ${TABULA_WORKER_TOKEN:-}
    ports:
      - "${TABULA_PORT:-3000}:3000"
    volumes:
      # Bug-report attachments (photos, videos, voice notes).
      - tabula-media:/data/media

volumes:
  tabula-pg:
  tabula-media:
